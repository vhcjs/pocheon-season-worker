<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>포천시 위탁형 계절근로자 관리자 시스템</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f0f2f5;color:#111}
button,input,textarea,select{font:inherit} .app{max-width:1400px;margin:auto;background:#fff;min-height:100vh;box-shadow:0 0 10px rgba(0,0,0,0.05)}
header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #ddd;background:#168b43;color:#fff}
.logo{font-weight:800;font-size:20px}
main{padding:20px}.panel{width:100%;margin:auto}

/* 엑셀 스타일 탭 메뉴 추가 */
.sheet-tabs{display:flex;background:#e9ecef;border-bottom:2px solid #168b43;padding-left:10px;gap:4px;margin-bottom:15px;}
.sheet-tab{padding:10px 20px;font-weight:700;font-size:14px;color:#495057;background:#dee2e6;border:1px solid #ced4da;border-bottom:none;border-radius:6px 6px 0 0;cursor:pointer;display:flex;align-items:center;gap:6px;}
.sheet-tab.active{background:#fff;color:#168b43;border-top:3px solid #168b43;border-color:#168b43 #168b43 #fff #168b43;}
.tab-content{display:none;}
.tab-content.active{display:block;}

.card{border:1px solid #ddd;border-radius:10px;padding:18px;margin-bottom:16px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,0.03)}
.title{font-size:22px;font-weight:800;margin-bottom:15px;color:#168b43;display:flex;justify-content:space-between;align-items:center}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.toolbar-btn{padding:8px 14px;border:1px solid #ccc;border-radius:6px;background:#f8f9fa;cursor:pointer;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.toolbar-btn:hover{background:#e2e6ea}
.toolbar-btn.excel{background:#28a745;color:#fff;border-color:#28a745}
.toolbar-btn.upload{background:#17a2b8;color:#fff;border-color:#17a2b8}
.toolbar-btn.stats{background:#6f42c1;color:#fff;border-color:#6f42c1}
.toolbar-btn.reset{background:#dc3545;color:#fff;border-color:#dc3545}
.toolbar-btn.sample{background:#fd7e14;color:#fff;border-color:#fd7e14}
.filter-bar{display:flex;gap:10px;margin-bottom:15px;align-items:center;flex-wrap:wrap;background:#f8f9fa;padding:12px;border-radius:8px;border:1px solid #e9ecef}
.filter-bar input, .filter-bar select{padding:6px 10px;border:1px solid #ced4da;border-radius:4px;font-size:13px;width:auto}

table{width:100%;border-collapse:collapse;font-size:13px;text-align:center}
th,td{border:1px solid #dee2e6;padding:9px 6px;vertical-align:middle}
th{background:#f1f3f5;font-weight:700;color:#333}
tr:nth-child(even){background:#f8f9fa}
tr:hover{background:#f1f5f9}
input[type="number"], input[type="text"], select{padding:4px 6px;border:1px solid #ccc;border-radius:4px;width:100%}
.btn-sm{padding:4px 8px;font-size:12px;border-radius:4px;border:none;cursor:pointer;font-weight:700}
.btn-save{background:#28a745;color:#fff}
.btn-cancel{background:#dc3545;color:#fff}
.btn-print{background:#17a2b8;color:#fff}
.btn-assign{background:#007bff;color:#fff}

.status-badge{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700;display:inline-block}
.status-wait{background:#fff3cd;color:#856404}
.status-done{background:#d4edda;color:#155724}
.status-cancel{background:#f8d7da;color:#721c24}

.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;z-index:9999}
.invoice-box{background:#fff;padding:25px;border-radius:12px;width:95%;max-width:900px;box-shadow:0 4px 20px rgba(0,0,0,0.2);max-height:90vh;overflow-y:auto}

.worker-select-box{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.worker-tag{background:#e9ecef;border:1px solid #ced4da;padding:2px 6px;border-radius:4px;font-size:11px;cursor:pointer}
.worker-tag.selected{background:#007bff;color:#fff;border-color:#007bff}

.notice-editor{display:flex;gap:10px;margin-bottom:15px;align-items:center;background:#e8f5e9;padding:10px;border-radius:8px;border:1px solid #c8e6c9;}
.notice-editor input{flex:1;}

@media print {
  body * { visibility: hidden; }
  #invoiceModal, #invoiceModal * { visibility: visible; }
  #invoiceModal { position: absolute; left: 0; top: 0; width: 100%; height: auto; background: none; }
  .modal-actions { display: none !important; }
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">포천시 위탁형 계절근로자 통합 관리 시스템</div>
  <div id="clock"></div>
</header>

<main><div class="panel">

<!-- 시트 탭 영역 (엑셀 스타일) -->
<div class="sheet-tabs">
  <div class="sheet-tab active" onclick="switchSheet('adminSheet', this)">📋 신청 및 근로자 관리 시트</div>
  <div class="sheet-tab" onclick="switchSheet('userSheet', this)">📱 농가 신청 페이지 시트</div>
</div>

<!-- 시트 1: 관리자 시스템 -->
<div id="adminSheet" class="tab-content active">
  <div class="card">
    <div class="title">
      <span>📢 공지사항 설정</span>
      <button class="toolbar-btn excel" onclick="saveNotice()">공지사항 저장</button>
    </div>
    <div class="notice-editor">
      <b style="min-width:70px;">제목:</b> <input type="text" id="noticeTitleInput" placeholder="공지사항 제목">
      <b style="min-width:70px;">내용:</b> <input type="text" id="noticeBodyInput" placeholder="공지사항 내용 (줄바꿈은 \n 사용)">
    </div>
  </div>

  <div class="card">
    <div class="title">
      <span>🌾 농가 신청 및 배정 관리 (전체)</span>
    </div>
    
    <div class="toolbar">
      <button class="toolbar-btn excel" onclick="exportCombinedExcel()">📊 통합 정산·급여집계표 (엑셀)</button>
      <label class="toolbar-btn upload">
        📁 근로자 명단 엑셀 업로드
        <input type="file" id="excelUpload" accept=".xlsx, .xls" style="display:none" onchange="handleExcelUpload(event)">
      </label>
      <button class="toolbar-btn stats" onclick="showWorkerStats()">👥 월별/연도별 급여명세서 (라오스어)</button>
      <button class="toolbar-btn sample" onclick="createSampleData()">🧪 샘플 데이터 생성</button>
      <button class="toolbar-btn reset" onclick="clearData()">전체 초기화</button>
    </div>

    <div class="filter-bar">
      <b>검색/필터:</b>
      <input type="date" id="filterDate" onchange="renderAdmin()">
      <input type="text" id="filterKeyword" placeholder="농가명/전화번호/접수번호" onkeyup="renderAdmin()">
      <select id="filterStatus" onchange="renderAdmin()">
        <option value="">전체 상태</option>
        <option value="접수대기">접수대기</option>
        <option value="배정완료">배정완료</option>
        <option value="취소">취소</option>
      </select>
      <button class="toolbar-btn" onclick="resetFilters()">필터 초기화</button>
    </div>

    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>접수번호</th>
            <th>신청일</th>
            <th>농가명</th>
            <th>연락처</th>
            <th>작업내용</th>
            <th>성별선호</th>
            <th>신청인원</th>
            <th>기초/연장시간</th>
            <th>총 단가(원)</th>
            <th>배정 근로자 지정</th>
            <th>상태</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="appTableBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="title">
      <span>👨‍🌾 등록 근로자 마스터 (총 <span id="workerCount">0</span>명)</span>
      <button class="toolbar-btn" onclick="addWorkerRow()">+ 근로자 직접 추가</button>
    </div>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>성명(영문/본명)</th>
            <th>호칭/부르는이름</th>
            <th>성별</th>
            <th>기본일당(원)</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="workerTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 시트 2: 농가 신청 페이지 (iframe 내장) -->
<div id="userSheet" class="tab-content">
  <div class="card" style="padding:10px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding:0 5px;">
      <span style="font-size:14px; font-weight:700; color:#168b43;">📱 농가 웹 신청 화면 (실시간 연동)</span>
      <button class="toolbar-btn" onclick="reloadUserIframe()">🔄 화면 새로고침</button>
    </div>
    <iframe id="userIframe" src="index.html" style="width:100%; height:820px; border:1px solid #ddd; border-radius:8px;"></iframe>
  </div>
</div>

</div></main>
</div>

<!-- 내역서 / 명세서 출력 모달 -->
<div id="invoiceModal" class="modal">
  <div class="invoice-box">
    <div id="invoiceFilterArea" class="filter-bar modal-actions" style="margin-bottom:15px; display:none;"></div>
    <div id="invoiceContent"></div>
    <div class="toolbar modal-actions" style="margin-top:20px; justify-content:flex-end;">
      <button class="toolbar-btn excel" id="modalShareBtn" style="display:none;" onclick="shareToKakaoOrLink()">🔗 영수증 링크 복사</button>
      <button class="toolbar-btn" id="modalPrintBtn" onclick="window.print()">🖨️ 인쇄하기</button>
      <button class="toolbar-btn stats" id="modalPdfBtn" onclick="downloadPDF()">📄 PDF 다운로드</button>
      <button class="toolbar-btn reset" onclick="closeInvoice()">닫기</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://dcdxzofzkvdbppsetarb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjZHh6b2Z6a3ZkYnBwc2V0YXJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzIzNzAsImV4cCI6MjEwMzE0ODM3MH0.g53YpeDm7XVQyLxDOTYa3n1pJ_xeyNAtdvgbpLZ4DZI';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const KEY = 'seasonWorkerPrototype_v1';
const WORKER_KEY = 'seasonWorkers_master_v1';
const NOTICE_KEY = 'seasonNotice_v1';
const BASE_DAILY_PRICE = 120000;

const defaultNotice = { title: '📢 공지사항', body: '• 일요일 및 공휴일은 근로자 휴무일로 신청이 불가능합니다.\n• 기본 하루 일당은 120,000원입니다.\n• 1일 기본 근로시간은 10시간입니다.\n• 당일 및 이전 날짜는 예약할 수 없으며, 오후 5시 이후에는 다음 날 예약이 제한됩니다.' };
const defaultWorkers = [
  { id: 'W001', name: 'INTHAVONG PHAIVANH', callName: '파이반', gender: '여성' },
  { id: 'W002', name: 'SIVILAY EMMY', callName: '에미', gender: '여성' },
  { id: 'W003', name: 'XAYYASENG KHAMPHOU', callName: '캄푸', gender: '남성' },
  { id: 'W004', name: 'PANETHONGDY NOUNE', callName: '눈', gender: '남성' },
  { id: 'W005', name: 'HER YENG', callName: '영', gender: '남성' }
];

// 시트 탭 전환 함수
function switchSheet(sheetId, tabEl) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.sheet-tab').forEach(el => el.classList.remove('active'));
  
  document.getElementById(sheetId).classList.add('active');
  tabEl.classList.add('active');

  if(sheetId === 'userSheet') {
    reloadUserIframe();
  } else {
    renderAdmin();
  }
}

function reloadUserIframe() {
  const iframe = document.getElementById('userIframe');
  iframe.src = iframe.src;
}

async function apiFetch(endpoint, method = 'GET', body = null) {
  try {
    if (endpoint === '/apps' && method === 'GET') {
      const { data, error } = await _supabase.from('apps').select('*').order('id', { ascending: true });
      if (error) throw error;
      return { apps: data || [] };
    }
    if (endpoint === '/apps' && method === 'POST') {
      const { data, error } = await _supabase.from('apps').insert([body]);
      if (error) throw error;
      return { success: true };
    }
    if (endpoint.startsWith('/apps/') && method === 'PUT') {
      const { data, error } = await _supabase.from('apps').update(body).eq('no', body.no);
      if (error) throw error;
      return { success: true };
    }
  } catch (e) {
    console.error('Supabase 연동 에러, LocalStorage 폴백 사용:', e);
    return JSON.parse(localStorage.getItem(KEY) || '{"apps":[]}');
  }
}

async function fetchWorkersFromDB() {
  try {
    const { data, error } = await _supabase.from('workers').select('*').order('id', { ascending: true });
    if (!error && data && data.length > 0) {
      localStorage.setItem(WORKER_KEY, JSON.stringify(data));
      return data;
    }
  } catch(e) { console.log('Workers fetch fallbacked', e); }
  return JSON.parse(localStorage.getItem(WORKER_KEY) || JSON.stringify(defaultWorkers));
}

async function saveWorkersToDB(workers) {
  localStorage.setItem(WORKER_KEY, JSON.stringify(workers));
  try {
    await _supabase.from('workers').delete().neq('id', '0000');
    await _supabase.from('workers').insert(workers);
  } catch(e) { console.error('Workers DB save error:', e); }
}

function loadNotice() {
  const data = JSON.parse(localStorage.getItem(NOTICE_KEY) || JSON.stringify(defaultNotice));
  document.getElementById('noticeTitleInput').value = data.title;
  document.getElementById('noticeBodyInput').value = data.body;
}

function saveNotice() {
  const title = document.getElementById('noticeTitleInput').value.trim();
  const body = document.getElementById('noticeBodyInput').value.trim();
  localStorage.setItem(NOTICE_KEY, JSON.stringify({ title, body }));
  alert('공지사항이 저장되었습니다.');
}

async function renderAdmin() {
  loadNotice();
  const workers = await fetchWorkersFromDB();
  const data = await apiFetch('/apps', 'GET');
  const apps = data.apps || [];

  const filterDate = document.getElementById('filterDate').value;
  const filterKeyword = document.getElementById('filterKeyword').value.trim().toLowerCase();
  const filterStatus = document.getElementById('filterStatus').value;

  let filteredApps = apps.filter(a => {
    if (filterDate && a.date !== filterDate) return false;
    if (filterStatus && a.status !== filterStatus) return false;
    if (filterKeyword) {
      const k = filterKeyword;
      const matchNo = (a.no || '').toLowerCase().includes(k);
      const matchName = (a.farmerName || '').toLowerCase().includes(k);
      const matchPhone = (a.phone || '').includes(k);
      if (!matchNo && !matchName && !matchPhone) return false;
    }
    return true;
  });

  const tbody = document.getElementById('appTableBody');
  tbody.innerHTML = filteredApps.map((a, idx) => {
    const selectedIds = a.selectedWorkerIds || [];
    let badgeClass = a.status === '배정완료' ? 'status-done' : (a.status === '취소' ? 'status-cancel' : 'status-wait');

    const workerTags = workers.map(w => {
      const isSel = selectedIds.includes(w.id);
      return `<span class="worker-tag ${isSel ? 'selected' : ''}" onclick="toggleAppWorker('${a.no}', '${w.id}')">${w.callName || w.name}</span>`;
    }).join(' ');

    return `
      <tr>
        <td><b>${a.no}</b></td>
        <td><input type="date" value="${a.date}" onchange="updateAppField('${a.no}', 'date', this.value)"></td>
        <td><input type="text" value="${a.farmerName || ''}" onchange="updateAppField('${a.no}', 'farmerName', this.value)"></td>
        <td><input type="text" value="${a.phone || ''}" onchange="updateAppField('${a.no}', 'phone', this.value)"></td>
        <td><input type="text" value="${a.work || ''}" onchange="updateAppField('${a.no}', 'work', this.value)"></td>
        <td>${a.gender || '무관'}</td>
        <td><input type="number" style="width:50px" value="${a.qty}" min="1" onchange="updateAppField('${a.no}', 'qty', parseInt(this.value))"></td>
        <td>
          <small>기초:</small><input type="number" style="width:40px" value="${a.baseHours || 10}" onchange="updateAppField('${a.no}', 'baseHours', parseFloat(this.value))">
          <small>연장:</small><input type="number" style="width:40px" value="${a.overtimeHours || 0}" onchange="updateAppField('${a.no}', 'overtimeHours', parseFloat(this.value))">
        </td>
        <td><b>₩${((a.totalPrice || (a.qty * BASE_DAILY_PRICE))).toLocaleString()}</b></td>
        <td><div class="worker-select-box">${workerTags}</div></td>
        <td><span class="status-badge ${badgeClass}">${a.status || '접수대기'}</span></td>
        <td>
          <button class="btn-sm btn-save" onclick="changeStatus('${a.no}', '배정완료')">완료</button>
          <button class="btn-sm btn-print" onclick="openInvoiceModal('${a.no}')">영수증</button>
          <button class="btn-sm btn-cancel" onclick="changeStatus('${a.no}', '취소')">취소</button>
        </td>
      </tr>
    `;
  }).join('');

  document.getElementById('workerCount').textContent = workers.length;
  const workerTbody = document.getElementById('workerTableBody');
  workerTbody.innerHTML = workers.map(w => `
    <tr>
      <td>${w.id}</td>
      <td><input type="text" value="${w.name}" onchange="updateWorkerField('${w.id}', 'name', this.value)"></td>
      <td><input type="text" value="${w.callName || ''}" placeholder="호칭" onchange="updateWorkerField('${w.id}', 'callName', this.value)"></td>
      <td>
        <select onchange="updateWorkerField('${w.id}', 'gender', this.value)">
          <option value="남성" ${w.gender === '남성' ? 'selected' : ''}>남성</option>
          <option value="여성" ${w.gender === '여성' ? 'selected' : ''}>여성</option>
        </select>
      </td>
      <td>₩${BASE_DAILY_PRICE.toLocaleString()}</td>
      <td><button class="btn-sm btn-cancel" onclick="deleteWorker('${w.id}')">삭제</button></td>
    </tr>
  `).join('');
}

async function updateAppField(appNo, field, val) {
  const data = await apiFetch('/apps', 'GET');
  const apps = data.apps || [];
  const app = apps.find(x => x.no === appNo);
  if (app) {
    app[field] = val;
    if (field === 'qty' || field === 'baseHours' || field === 'overtimeHours') {
      const basePrice = (app.baseHours || 10) * (BASE_DAILY_PRICE / 10);
      const otPrice = (app.overtimeHours || 0) * 15000;
      app.totalPrice = app.qty * (basePrice + otPrice);
    }
    await apiFetch(`/apps/${appNo}`, 'PUT', app);
    renderAdmin();
  }
}

async function toggleAppWorker(appNo, workerId) {
  const workers = await fetchWorkersFromDB();
  const data = await apiFetch('/apps', 'GET');
  const apps = data.apps || [];
  const app = apps.find(x => x.no === appNo);
  if (!app) return;

  app.selectedWorkerIds = app.selectedWorkerIds || [];
  const idx = app.selectedWorkerIds.indexOf(workerId);
  if (idx >= 0) app.selectedWorkerIds.splice(idx, 1);
  else app.selectedWorkerIds.push(workerId);

  app.workers = app.selectedWorkerIds.map(id => {
    const w = workers.find(x => x.id === id);
    return w ? (w.callName ? `[${w.callName}] ${w.name}` : w.name) : '';
  });

  if (app.selectedWorkerIds.length > 0) app.status = '배정완료';
  await apiFetch(`/apps/${appNo}`, 'PUT', app);
  renderAdmin();
}

async function changeStatus(appNo, status) {
  await updateAppField(appNo, 'status', status);
}

async function updateWorkerField(id, field, val) {
  let workers = await fetchWorkersFromDB();
  let w = workers.find(x => x.id === id);
  if (w) {
    w[field] = val;
    await saveWorkersToDB(workers);
    renderAdmin();
  }
}

async function addWorkerRow() {
  let workers = await fetchWorkersFromDB();
  const newId = 'W' + String(workers.length + 1).padStart(3, '0');
  workers.push({ id: newId, name: '새 근로자', callName: '별칭', gender: '남성' });
  await saveWorkersToDB(workers);
  renderAdmin();
}

async function deleteWorker(id) {
  if (!confirm('이 근로자를 삭제하시겠습니까?')) return;
  let workers = await fetchWorkersFromDB();
  workers = workers.filter(w => w.id !== id);
  await saveWorkersToDB(workers);
  renderAdmin();
}

function resetFilters() {
  document.getElementById('filterDate').value = '';
  document.getElementById('filterKeyword').value = '';
  document.getElementById('filterStatus').value = '';
  renderAdmin();
}

async function openInvoiceModal(appNo) {
  const data = await apiFetch('/apps', 'GET');
  const app = (data.apps || []).find(x => x.no === appNo);
  if (!app) return;

  const content = `
    <div id="printArea" style="padding:20px; font-family:sans-serif;">
      <h2 style="text-align:center; color:#168b43; margin-bottom:20px;">농가 계절근로자 작업 확인 및 영수증</h2>
      <table style="width:100%; border-collapse:collapse; margin-bottom:20px;">
        <tr><th style="width:30%;">접수번호</th><td>${app.no}</td></tr>
        <tr><th>작업일자</th><td>${app.date}</td></tr>
        <tr><th>농가명</th><td>${app.farmerName} (${app.phone})</td></tr>
        <tr><th>농지주소</th><td>${app.address || '-'}</td></tr>
        <tr><th>작업내용</th><td>${app.work}</td></tr>
        <tr><th>신청인원</th><td>${app.qty} 명</td></tr>
        <tr><th>배정근로자</th><td>${(app.workers || []).join(', ') || '미배정'}</td></tr>
        <tr><th>청구 금액</th><td><b style="font-size:18px; color:#d33;">₩${(app.totalPrice || (app.qty * BASE_DAILY_PRICE)).toLocaleString()} 원</b></td></tr>
      </table>
      <div style="text-align:center; margin-top:30px; font-size:12px; color:#777;">포천시 농업재단 영농인력지원팀</div>
    </div>
  `;
  document.getElementById('invoiceContent').innerHTML = content;
  document.getElementById('invoiceModal').style.display = 'flex';
}

function closeInvoice() { document.getElementById('invoiceModal').style.display = 'none'; }

document.getElementById('clock').textContent = new Date().toLocaleDateString('ko-KR');
renderAdmin();
</script>
</body>
</html>
