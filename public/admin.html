/* 마우스 드래그 기능 구현 */
function makeModalDraggable(elmnt, headerElmnt) {
  let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
  if (headerElmnt) {
    headerElmnt.onmousedown = dragMouseDown;
  } else {
    elmnt.onmousedown = dragMouseDown;
  }

  function dragMouseDown(e) {
    e = e || window.event;
    e.preventDefault();
    pos3 = e.clientX;
    pos4 = e.clientY;
    document.onmouseup = closeDragElement;
    document.onmousemove = elementDrag;
  }

  function elementDrag(e) {
    e = e || window.event;
    e.preventDefault();
    pos1 = pos3 - e.clientX;
    pos2 = pos4 - e.clientY;
    pos3 = e.clientX;
    pos4 = e.clientY;
    elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
    elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
  }

  function closeDragElement() {
    document.onmouseup = null;
    document.onmousemove = null;
  }
}

async function pickDate(dt){ let isPastOrToday = dt <= new Date().toISOString().split('T')[0]; let now = new Date(); let isTomorrowAfter5PM = false; if (now.getHours() >= DEADLINE_HOUR) { let tomorrow = new Date(); tomorrow.setDate(now.getDate() + 1); let tomorrowStr = \`\${tomorrow.getFullYear()}-\${String(tomorrow.getMonth()+1).padStart(2,'0')}-\${String(tomorrow.getDate()).padStart(2,'0')}\`; if (dt === tomorrowStr) isTomorrowAfter5PM = true; } if (isPastOrToday || isTomorrowAfter5PM) { alert('당일 및 지난 날짜, 혹은 오후 5시 이후의 익일 예약은 불가능합니다.'); return; } selectedDate = dt; selectedWorkers = []; qty = 1; document.getElementById('qty').value = qty; updatePrice(); await renderCalendar(); await renderWorkers(); }

async function lookup(){ 
  let p = prompt('접수번호, 전화번호, 또는 농장주명을 입력해 주세요.'); 
  if(!p || !p.trim()) return; 
  const rawQuery = p.trim(); 
  const cleanQuery = rawQuery.toUpperCase().replace(/[\\s-]/g, ''); 
  const data = await apiFetch('/apps', 'GET'); 
  const apps = data.apps || []; 
  let userApps = apps.filter(x => { 
    const cleanNo = (x.no || '').toUpperCase().replace(/[\\s-]/g, ''); 
    const cleanPhone = (x.phone || '').replace(/[\\s-]/g, ''); 
    const farmerName = (x.farmerName || '').trim(); 
    return cleanNo.includes(cleanQuery) || cleanPhone.includes(cleanQuery) || farmerName.includes(rawQuery); 
  }); 
  if(!userApps.length){ showAlert('🔍', '내역 없음', '입력하신 정보와 일치하는 신청 내역이 없습니다.'); return; } 
  let msg = \`<h3 style="margin-top:0;color:#168b43;text-align:center;">📋 신청 내역 조회 결과</h3>\`; 
  msg += \`<p style="font-size:13px;color:#666;text-align:center;margin-bottom:15px;">검색어: <b>\${rawQuery}</b> (총 \${userApps.length}건)</p>\`; 
  userApps.forEach((x, idx) => { 
    let statusBg = x.status === '배정완료' ? '#dff5e6' : (x.status === '취소' ? '#f8d7da' : '#fff3cd'); 
    let statusColor = x.status === '배정완료' ? '#08752f' : (x.status === '취소' ? '#721c24' : '#8a6500'); 
    msg += \`<div style="border:1px solid #ddd;padding:12px;border-radius:8px;margin-bottom:10px;background:#fcfdfd;"><div style="display:flex;justify-content:space-between;align-items:center;"><b>\${idx + 1}. 접수번호: \${x.no}</b><span style="background:\${statusBg};color:\${statusColor};padding:3px 8px;border-radius:12px;font-size:12px;font-weight:bold;">\${x.status || '접수대기'}</span></div><div style="font-size:13px;color:#444;margin-top:6px;line-height:1.5;">• 농가명: <b>\${x.farmerName}</b> (\${x.phone})<br>• 접수일시: \${x.createdAt || '기록없음'}<br>• 신청일: \${x.date} | 신청인원: \${x.qty}명<br>• 작업내용: \${x.work}</div>\`; 
    if (x.status !== '취소') { msg += \`<div style="text-align:right;margin-top:8px;"><button class="mini" style="background:#dc3545;color:#fff;border:0;" onclick="cancelAppByUser('\${x.no}')">취소하기</button></div>\`; } 
    msg += \`</div>\`; 
  }); 
  document.getElementById('invoiceContent').innerHTML = msg; 
  document.getElementById('invoiceModal').style.display = 'flex'; 
}

    await apiFetch(\`/apps/\${idx}\`, 'PUT', { no: appNo, status: '취소', selectedWorkerIds: [], workers: [] });

    if (parent && parent.renderAdmin) parent.renderAdmin(); 
  } 
}

async function apiFetch(endpoint, method = 'GET', body = null) {
  try {
    if (endpoint === '/apps' && method === 'GET') {
      const { data, error } = await _supabase.from('apps').select('*').order('id', { ascending: true });
      if (error) throw error;
      return { apps: data || [] };
    }
    if (endpoint === '/apps' && method === 'POST') {
      const { data, error } = await _supabase.from('apps').insert([body]);
      if (error) throw error;
      return { success: true };
    }
    if (endpoint.startsWith('/apps/') && method === 'PUT') {
      const { data, error } = await _supabase.from('apps').update(body).eq('no', body.no);
      if (error) throw error;
      return { success: true };
    }
  } catch (e) {
    console.error('Supabase 연동 에러:', e);
    const local = JSON.parse(localStorage.getItem(KEY) || '{"apps":[]}');
    return local;
  }
}

function getFarmerHistory(apps, currentPhone, currentNo) {
  const pastApps = apps.filter(a => a.phone === currentPhone && a.no !== currentNo);
  if (pastApps.length === 0) return null;

  const latest = pastApps[pastApps.length - 1];
  const works = pastApps.map(a => a.work).filter(Boolean);
  const workerIds = pastApps.flatMap(a => a.selectedWorkerIds || []);
  
  const workerCountMap = {};
  workerIds.forEach(id => { workerCountMap[id] = (workerCountMap[id] || 0) + 1; });
  const favoriteWorkerIds = Object.keys(workerCountMap).sort((a,b) => workerCountMap[b] - workerCountMap[a]);

  return {
    count: pastApps.length,
    latestAddress: latest.address || '주소 정보 없음',
    latestQty: latest.qty,
    recentWorks: [...new Set(works)].join(', '),
    favoriteWorkerIds: favoriteWorkerIds,
    pastApps: pastApps
  };
}

async function openAssignModal(appIndex) {
  const data = await apiFetch('/apps', 'GET');
  const apps = data.apps || [];
  const item = apps[appIndex];
  if (!item) return;

  const workers = await fetchWorkersFromDB();
  const currentSelected = new Set(item.selectedWorkerIds || []);
  const allowedQty = item.qty || workers.length;

  const alreadyAssignedOnThisDate = new Set();
  apps.filter(a => a.date === item.date && a.no !== item.no && a.status !== '취소').forEach(a => {
    (a.selectedWorkerIds || []).forEach(id => alreadyAssignedOnThisDate.add(id));
  });

  const stats = {};
  workers.forEach(w => {
    let days = 0, hours = 0;
    apps.filter(a => a.status === '배정완료').forEach(a => {
      if ((a.selectedWorkerIds || []).includes(w.id)) {
        days++;
        hours += BASE_DAILY_HOURS + (a.overtimeHours || 0);
      }
    });
    stats[w.id] = { days, hours };
  });

  let html = `<p style="font-size:14px;"><b>${item.farmerName} 농가 | 신청일: ${item.date} (신청요청 인원: ${item.qty}명)</b></p>
  <p style="font-size:13px;color:#d9534f;margin-top:-5px;">⚠️ 당일 타농가 배정 근로자는 선택 불가하며, 신청하신 인원 <b>${allowedQty}명</b>까지만 선택할 수 있습니다.</p>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;max-height:50vh;overflow-y:auto;padding:2px;" id="workerCheckboxContainer">`;

  workers.forEach(w => {
    let isChecked = currentSelected.has(w.id);
    let isAlreadyBusy = alreadyAssignedOnThisDate.has(w.id);
    let s = stats[w.id] || { days: 0, hours: 0 };
    
    let boxBg = '#fff';
    if (isChecked) boxBg = '#e8f5e9';
    if (isAlreadyBusy) boxBg = '#f1f1f1';

    html += `<label style="border:1px solid ${isAlreadyBusy ? '#ddd' : '#ccc'};padding:12px;border-radius:8px;background:${boxBg};cursor:${isAlreadyBusy?'not-allowed':'pointer'};font-size:14px;opacity:${isAlreadyBusy?'0.6':'1'};">
      <input type="checkbox" name="adminWorkerPick" value="${w.id}" ${isChecked ? 'checked' : ''} ${isAlreadyBusy ? 'disabled' : ''} onchange="validateWorkerSelection(${allowedQty})">
      <b>${w.callName ? '['+w.callName+']' : ''} ${w.name}</b>
      ${isAlreadyBusy ? '<br><small style="color:#d9534f;font-weight:bold;">[당일 타농가 배정됨]</small>' : ''}
      <div style="font-size:13px;color:#444;margin-top:6px;border-top:1px dashed #eee;padding-top:4px;">
        🗓️ 당월 누적: <b style="color:#168b43">${s.days}일</b> (${s.hours}시간)
      </div>
    </label>`;
  });

  html += `</div><button class="primary" style="margin-top:15px;width:100%;font-size:15px;" onclick="saveAssignment(${appIndex})">배정 저장하기</button>`;

  document.getElementById('modalTitle').textContent = '계절근로자 배정 관리';
  document.getElementById('invoiceFilterArea').innerHTML = '';
  document.getElementById('invoiceContent').innerHTML = html;
  document.getElementById('modalShareBtn').style.display = 'none';
  document.getElementById('modalPrintBtn').style.display = 'none';
  document.getElementById('modalPdfBtn').style.display = 'none';
  document.getElementById('invoiceModal').style.display = 'flex';
}

function validateWorkerSelection(maxAllowedQty) {
  const checkboxes = document.querySelectorAll('input[name="adminWorkerPick"]:checked');
  if (checkboxes.length > maxAllowedQty) {
    alert(`신청하신 인원 수(${maxAllowedQty}명)를 초과하여 배정할 수 없습니다.`);
    event.target.checked = false;
  }
}

async function saveAssignment(appIndex) {
  const data = await apiFetch('/apps', 'GET');
  const apps = data.apps || [];
  const item = apps[appIndex];
  const checkboxes = document.querySelectorAll('input[name="adminWorkerPick"]:checked');
  const selectedIds = Array.from(checkboxes).map(cb => cb.value);

  if (selectedIds.length > item.qty) {
    alert(`신청 인원(${item.qty}명)보다 많은 인원이 선택되었습니다.`);
    return;
  }

  let currentApps = JSON.parse(localStorage.getItem(KEY) || '{"apps":[]}');
  if (currentApps.apps && currentApps.apps[appIndex]) {
    currentApps.apps[appIndex].selectedWorkerIds = selectedIds;
    currentApps.apps[appIndex].status = selectedIds.length > 0 ? '배정완료' : '접수대기';
    currentApps.apps[appIndex].totalPrice = selectedIds.length * BASE_DAILY_PRICE + ((selectedIds.length * (currentApps.apps[appIndex].overtimeHours || 0)) * OVERTIME_HOURLY_WAGE);
    localStorage.setItem(KEY, JSON.stringify(currentApps));
  }
  
  await apiFetch(`/apps/${appIndex}`, 'PUT', {
    ...item,
    selectedWorkerIds: selectedIds,
    status: selectedIds.length > 0 ? '배정완료' : '접수대기',
    totalPrice: selectedIds.length * BASE_DAILY_PRICE + ((selectedIds.length * (item.overtimeHours || 0)) * OVERTIME_HOURLY_WAGE)
  });

  closeInvoice(); 
  renderAdmin();
}

function generateDateFilter(idPrefix, callbackName, currentYear, currentMonth) {
  let yearOpts = `<option value="all" ${currentYear==='all'?'selected':''}>전체 연도</option>`;
  for(let y=2024; y<=2030; y++) yearOpts += `<option value="${y}" ${currentYear==y?'selected':''}>${y}년</option>`;
  
  let monthOpts = `<option value="all" ${currentMonth==='all'?'selected':''}>전체 월</option>`;
  for(let m=1; m<=12; m++) {
    let mVal = m < 10 ? '0' + m : String(m);
    monthOpts += `<option value="${mVal}" ${currentMonth===mVal?'selected':''}>${m}월</option>`;
  }

  return `<div class="filter-row">
    <strong>📅 조회 기간:</strong>
    <select id="${idPrefix}Year" onchange="${callbackName}">${yearOpts}</select>
    <select id="${idPrefix}Month" onchange="${callbackName}">${monthOpts}</select>
  </div>`;
}

async function openInvoiceByFarmer(farmerName) {
  const data = await apiFetch('/apps', 'GET');
  const apps = data.apps || [];
  let targetApp = apps.find(a => a.farmerName === farmerName && a.date);
  
  let defaultYear = 'all';
  let defaultMonth = 'all';
  
  if (targetApp && targetApp.date) {
    let parts = targetApp.date.split('-');
    if (parts.length >= 2) {
      defaultYear = parts[0];
      defaultMonth = parts[1];
    }
  }
  openInvoice(farmerName, defaultYear, defaultMonth);
}

async function openInvoice(farmerName, forceYear, forceMonth) {
  const yEl = document.getElementById('invYear');
  const mEl = document.getElementById('invMonth');
  
  let year = yEl ? yEl.value : (forceYear || 'all');
  let month = mEl ? mEl.value : (forceMonth || 'all');

  const data = await apiFetch('/apps', 'GET');
  const apps = data.apps || [];
  let filtered = apps.filter(a => {
    if (a.farmerName !== farmerName || a.status !== '배정완료' || !a.selectedWorkerIds || a.selectedWorkerIds.length === 0) return false;
    if (!a.date) return false;
    let parts = a.date.split('-');
    let aY = parts[0];
    let aM = parts[1];
    
    if (year !== 'all' && aY !== String(year)) return false;
    if (month !== 'all' && aM !== String(month)) return false;
    return true;
  });

  let filterHtml = generateDateFilter('inv', `openInvoice('${farmerName}')`, year, month);
  let html = `<div style="text-align:center;margin-bottom:15px;">
    <h3 style="font-size:16px;">포천시 계절근로자 이용 청구서</h3>
    <p style="font-size:14px;color:#555">청구 대상: <b>${farmerName}</b> 농가 귀하</p>
  </div>`;

  if(!filtered.length) {
    html += `<p style="text-align:center;padding:20px;font-size:14px;color:#666;">해당 기간에 청구(배정완료) 내역이 없습니다.</p>`;
  } else {
    let totalSum = 0;
    html += `<div class="scrollable-table-wrap"><table class="invoice-table">
      <thead><tr><th>작업일자</th><th>배정인원</th><th>연장시간</th><th>일 청구금액</th></tr></thead><tbody>`;
    filtered.forEach(a => {
      let count = a.selectedWorkerIds.length;
      let p = a.totalPrice || (count * BASE_DAILY_PRICE);
      totalSum += p;
      html += `<tr><td>${a.date}</td><td>${count}명</td><td>${a.overtimeHours||0}시간</td><td>₩${p.toLocaleString()}</td></tr>`;
    });
    html += `</tbody></table></div>
    <div style="text-align:right;font-size:18px;font-weight:bold;margin-top:20px;color:#168b43">총 청구 금액: ₩${totalSum.toLocaleString()}</div>`;
  }

  document.getElementById('modalTitle').textContent = `청구서 (${farmerName})`;
  document.getElementById('invoiceFilterArea').innerHTML = filterHtml;
  document.getElementById('invoiceContent').innerHTML = html;
  document.getElementById('modalShareBtn').style.display = 'none';
  document.getElementById('modalPrintBtn').style.display = 'inline-block';
  document.getElementById('modalPdfBtn').style.display = 'inline-block';
  document.getElementById('invoiceModal').style.display = 'flex';
}

      <tr><td>연장 근무시간 (ຊົ່ວໂມງເພີ່ມ):</td><td style="text-align:right"><b>${overHours} 시간</b></td></tr>
      <tr><td>기본급 (${BASE_DAILY_HOURS}시간 기준):</td><td style="text-align:right">₩${basePay.toLocaleString()}</td></tr>
      <tr><td>연장 수당 (ເງິນໂອທີ):</td><td style="text-align:right">₩${overPay.toLocaleString()}</td></tr>
      <tr style="font-size:16px;color:#168b43;font-weight:bold;"><td style="padding-top:10px">실수령액 (ເງິນສຸດທິ):</td><td style="text-align:right;padding-top:10px">₩${totalPay.toLocaleString()}</td></tr>
    </table>
  </div>`;
  
  document.getElementById('modalTitle').textContent = '상세 급여 명세서';
  document.getElementById('invoiceContent').innerHTML = html;
  document.getElementById('modalShareBtn').style.display = 'none';
  document.getElementById('modalPrintBtn').style.display = 'inline-block';
  document.getElementById('modalPdfBtn').style.display = 'inline-block';
}

function downloadPdfNotice() {
  alert('인쇄 창이 나타나면 대상 프린터를 [PDF로 저장]으로 선택해 주세요.');
  window.print();
}

async function exportCombinedExcel() {
  const data = await apiFetch('/apps', 'GET');
  const apps = data.apps || [];
  if(!apps.length) { alert('데이터가 없습니다.'); return; }
  const excelData = apps.map(a => {
    let assignedCount = (a.selectedWorkerIds && a.selectedWorkerIds.length > 0) ? a.selectedWorkerIds.length : 0;
    return {
      '접수번호': a.no, '접수일시': a.createdAt || '-', '작업일자': a.date, '농장주': a.farmerName, '신청인원': a.qty, '배정인원': assignedCount,
      '연장근무(시간)': a.overtimeHours || 0, '총정산금액': (a.status === '배정완료' && assignedCount > 0) ? (a.totalPrice || (assignedCount * BASE_DAILY_PRICE)) : 0, '상태': a.status
    };
  });
  const ws = XLSX.utils.json_to_sheet(excelData);
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "통합정산표");
  XLSX.writeFile(wb, `포천시_계절근로자_통합정산.xlsx`);
}

function handleExcelUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function(evt) {
    const wb = XLSX.read(new Uint8Array(evt.target.result), {type: 'array'});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
    
    let newWorkers = rows.map((r, i) => ({ 
      id: `W${String(i+1).padStart(3, '0')}`, 
      name: r['근로자명'] || r['이름'] || r['성명'] || '미상', 
      callName: r['콜네임'] || r['호칭'] || r['별명'] || '', 
      gender: r['성별'] || r['Gender'] || '남' 
    }));
    
    if(newWorkers.length > 0) { 
      saveWorkerList(newWorkers); 

      try {
        await _supabase.from('workers').delete().neq('id', 'CLEAR_ALL');
        await _supabase.from('workers').insert(newWorkers);
      } catch(err) {
        console.error('Supabase workers 업로드 실패:', err);
      }

      renderAdmin(); 
      alert(`${newWorkers.length}명의 근로자 명단이 성공적으로 DB에 등록되어 모바일과 동기화되었습니다.`); 
    }
  };
  reader.readAsArrayBuffer(file);
}

      { no: 'REC-2026-003', createdAt: '2026. 8. 28. 오후 1:10:00', date: formatDate(nextMonthObj3), farmerName: '김포천', phone: '010-1111-2222', address: '경기도 포천시 영중면 성동리', work: '인삼밭 차광막 설치', qty: 2, status: '배정완료', selectedWorkerIds: ['W001', 'W004'], overtimeHours: 0, totalPrice: 2 * BASE_DAILY_PRICE }
    ]

  localStorage.setItem(KEY, JSON.stringify(sampleApps));

async function editHours(i){
  const data = await apiFetch('/apps', 'GET');
  const apps = data.apps || [];
  let over = prompt('추가 연장 근무 시간을 입력해 주세요 (시간)', apps[i].overtimeHours || 0);
  if (over !== null) {
    let overH = parseFloat(over) || 0;
    let currentApps = JSON.parse(localStorage.getItem(KEY) || '{"apps":[]}');
    if (currentApps.apps && currentApps.apps[i]) {
      currentApps.apps[i].overtimeHours = overH;
      let count = (currentApps.apps[i].selectedWorkerIds && currentApps.apps[i].selectedWorkerIds.length > 0) ? currentApps.apps[i].selectedWorkerIds.length : currentApps.apps[i].qty;
      currentApps.apps[i].totalPrice = (count * BASE_DAILY_PRICE) + (count * overH * OVERTIME_HOURLY_WAGE);
      localStorage.setItem(KEY, JSON.stringify(currentApps));
    }
    renderAdmin();
  }
}

async function cancelAppByAdmin(i) {
  if (confirm('정말 취소하시겠습니까?')) { 
    let currentApps = JSON.parse(localStorage.getItem(KEY) || '{"apps":[]}');
    if (currentApps.apps && currentApps.apps[i]) {
      currentApps.apps[i].status = '취소';
      currentApps.apps[i].selectedWorkerIds = [];
      currentApps.apps[i].totalPrice = 0;
      localStorage.setItem(KEY, JSON.stringify(currentApps));
    }
    renderAdmin(); 
  }
}

function clearData(){ if(confirm('정말 전체 데이터를 초기화하시겠습니까?')){ localStorage.clear(); location.reload(); } }
