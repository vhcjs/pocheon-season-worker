<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>포천시 위탁형 계절근로자 관리자 시스템</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f4f6f9;color:#111}
button,input,textarea,select{font:inherit} .app{max-width:1200px;margin:auto;background:#fff;min-height:100vh}
header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #ddd;background:#1b2a47;color:#fff}
.logo{font-weight:800;font-size:18px}
main{padding:28px 20px}.title{font-size:24px;font-weight:800;margin-bottom:20px}
.card{border:1px solid #ddd;border-radius:12px;padding:20px;margin-bottom:20px;background:#fff;box-shadow:0 2px 8px #0000000d}
label{display:block;font-weight:700;margin:0 0 8px} input,textarea,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;background:#fff} textarea{min-height:80px;resize:vertical}
.actions{display:flex;gap:10px;margin-top:10px}
.primary,.secondary,.danger{border:0;border-radius:6px;padding:10px 16px;cursor:pointer;font-weight:700}
.primary{background:#168b43;color:#fff}.secondary{background:#e2e8f0;color:#333}.danger{background:#e11;color:#fff}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
th,td{border:1px solid #e2e8f0;padding:10px;text-align:left;vertical-align:middle}
th{background:#f8fafc;font-weight:700}
.callname-tag{display:inline-block;background:#e8f5e9;color:#08752f;font-weight:800;padding:2px 6px;border-radius:4px;border:1px solid #a5d6a7;font-size:12px;margin-right:4px;}
.badge{display:inline-block;padding:4px 8px;border-radius:12px;font-size:12px;font-weight:bold}
.badge-wait{background:#fff3cd;color:#8a6500}.badge-done{background:#dff5e6;color:#08752f}.badge-cancel{background:#f8d7da;color:#721c24}
@media(max-width:768px){main{padding:15px 10px}.title{font-size:20px}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">포천시 계절근로자 [관리자 전용]</div><div id="clock"></div></header>

<main>
  <div class="title">근로자 명단 & 공지사항 관리</div>

  <!-- 1. 공지사항 관리 -->
  <div class="card">
    <h3>📢 공지사항 설정</h3>
    <div style="margin-bottom:10px">
      <label>공지 제목</label>
      <input id="noticeTitle" placeholder="공지 제목을 입력하세요">
    </div>
    <div style="margin-bottom:10px">
      <label>공지 내용</label>
      <textarea id="noticeBody" placeholder="공지 내용을 입력하세요"></textarea>
    </div>
    <button class="primary" onclick="saveNotice()">공지사항 저장 및 적용</button>
  </div>

  <!-- 2. 근로자 명단 엑셀 업로드 -->
  <div class="card">
    <h3>👷 근로자 명단 관리 (엑셀 업로드)</h3>
    <p style="font-size:13px;color:#666">※ 엑셀 파일 첫 번째 줄에 <b>[근로자명, 콜네임, 성별]</b> 열이 포함되어 있어야 합니다.</p>
    <div style="display:flex;gap:10px;align-items:center;">
      <input type="file" id="excelFile" accept=".xlsx, .xls" style="width:auto">
      <button class="primary" onclick="document.getElementById('excelFile').click()">엑셀 불러오기</button>
    </div>
    <div style="margin-top:15px;" class="table-wrap">
      <h4>현재 등록된 근로자 목록 (<span id="workerCount">0</span>명)</h4>
      <table>
        <thead><tr><th>ID</th><th>이름(호칭)</th><th>성별</th></tr></thead>
        <tbody id="workerTable"></tbody>
      </table>
    </div>
  </div>

  <!-- 3. 신청 내역 목록 -->
  <div class="card">
    <h3>📋 전체 신청 내역 목록</h3>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>접수번호</th><th>신청일자</th><th>농가명/연락처</th><th>작업내용</th><th>지명 근로자</th><th>신청인원</th><th>상태</th><th>관리</th>
          </tr>
        </thead>
        <tbody id="appTable"></tbody>
      </table>
    </div>
  </div>
</main>
</div>

<script>
const SUPABASE_URL = 'https://dcdxzofzkvdbppsetarb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjZHh6b2Z6a3ZkYnBwc2V0YXJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzIzNzAsImV4cCI6MjEwMzE0ODM3MH0.g53YpeDm7XVQyLxDOTYa3n1pJ_xeyNAtdvgbpLZ4DZI';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const WORKER_KEY = 'seasonWorkers_master_v1';
const NOTICE_KEY = 'seasonNotice_v1';
const APP_KEY = 'seasonWorkerPrototype_v1';

const defaultNotice = { title: '📢 공지사항', body: '• 일요일 및 공휴일은 근로자 휴무일로 신청이 불가능합니다.\n• 기본 하루 일당은 120,000원입니다.\n• 1일 기본 근로시간은 10시간입니다.' };
const defaultWorkers = [
  { id: 'W001', name: 'INTHAVONG PHAIVANH', callName: '파이반', gender: '여성' },
  { id: 'W002', name: 'SIVILAY EMMY', callName: '에미', gender: '여성' },
  { id: 'W003', name: 'XAYYASENG KHAMPHOU', callName: '캄푸', gender: '남성' },
  { id: 'W004', name: 'PANETHONGDY NOUNE', callName: '눈', gender: '남성' },
  { id: 'W005', name: 'HER YENG', callName: '영', gender: '남성' }
];

// 공지사항 불러오기 & 저장
function loadNotice() {
  const data = JSON.parse(localStorage.getItem(NOTICE_KEY) || JSON.stringify(defaultNotice));
  document.getElementById('noticeTitle').value = data.title;
  document.getElementById('noticeBody').value = data.body;
}

function saveNotice() {
  const noticeData = {
    title: document.getElementById('noticeTitle').value,
    body: document.getElementById('noticeBody').value
  };
  localStorage.setItem(NOTICE_KEY, JSON.stringify(noticeData));
  alert('공지사항이 저장되었습니다.');
}

// 근로자 불러오기 (Supabase DB 우선)
async function fetchWorkers() {
  try {
    const { data, error } = await _supabase.from('workers').select('*').order('id', { ascending: true });
    if (!error && data && data.length > 0) {
      localStorage.setItem(WORKER_KEY, JSON.stringify(data));
      return data;
    }
  } catch(e) {
    console.error(e);
  }
  return JSON.parse(localStorage.getItem(WORKER_KEY) || JSON.stringify(defaultWorkers));
}

// 근로자 테이블 출력
async function renderWorkers() {
  const list = await fetchWorkers();
  document.getElementById('workerCount').textContent = list.length;
  document.getElementById('workerTable').innerHTML = list.map(w => `
    <tr>
      <td>${w.id}</td>
      <td>${w.callName ? '<span class="callname-tag">['+w.callName+']</span>' : ''}${w.name}</td>
      <td>${w.gender}</td>
    </tr>
  `).join('');
}

// 엑셀 파일 업로드 처리
document.getElementById('excelFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function(evt) {
    const wb = XLSX.read(new Uint8Array(evt.target.result), {type: 'array'});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
    
    let newWorkers = rows.map((r, i) => ({ 
      id: `W${String(i+1).padStart(3, '0')}`, 
      name: r['근로자명'] || r['이름'] || r['성명'] || '미상', 
      callName: r['콜네임'] || r['호칭'] || r['별명'] || '', 
      gender: r['성별'] || r['Gender'] || '남' 
    }));
    
    if(newWorkers.length > 0) { 
      localStorage.setItem(WORKER_KEY, JSON.stringify(newWorkers));
      
      // Supabase DB 저장 연동
      try {
        await _supabase.from('workers').delete().neq('id', 'CLEAR_ALL');
        await _supabase.from('workers').insert(newWorkers);
      } catch(err) {
        console.error('Supabase workers 업로드 실패:', err);
      }

      await renderWorkers(); 
      alert(`${newWorkers.length}명의 근로자 명단이 성공적으로 DB에 등록되었습니다.`); 
    }
  };
  reader.readAsArrayBuffer(file);
});

// 신청 내역 목록 출력
async function renderApps() {
  let apps = [];
  try {
    const { data, error } = await _supabase.from('apps').select('*').order('id', { ascending: false });
    if(!error && data) apps = data;
  } catch(e) {
    const local = JSON.parse(localStorage.getItem(APP_KEY) || '{"apps":[]}');
    apps = local.apps || [];
  }

  document.getElementById('appTable').innerHTML = apps.map(a => {
    let statusClass = a.status === '배정완료' ? 'badge-done' : (a.status === '취소' ? 'badge-cancel' : 'badge-wait');
    let workerNames = (a.workers || []).join(', ') || '없음';
    
    return `
      <tr>
        <td><b>${a.no}</b></td>
        <td>${a.date}</td>
        <td><b>${a.farmerName}</b><br><small>${a.phone}</small></td>
        <td>${a.work}</td>
        <td><small>${workerNames}</small></td>
        <td>${a.qty}명</td>
        <td><span class="badge ${statusClass}">${a.status || '접수대기'}</span></td>
        <td>
          <button class="primary" style="padding:4px 8px;font-size:12px" onclick="updateStatus('${a.no}', '배정완료')">완료</button>
          <button class="danger" style="padding:4px 8px;font-size:12px" onclick="updateStatus('${a.no}', '취소')">취소</button>
        </td>
      </tr>
    `;
  }).join('');
}

// 신청 상태 변경 함수
async function updateStatus(no, status) {
  if(!confirm(`접수번호 [${no}] 건을 [${status}] 상태로 변경하시겠습니까?`)) return;
  try {
    await _supabase.from('apps').update({ status: status }).eq('no', no);
    alert('상태가 변경되었습니다.');
    renderApps();
  } catch(e) {
    alert('업데이트 실패: ' + e.message);
  }
}

document.getElementById('clock').textContent = new Date().toLocaleDateString('ko-KR');
loadNotice();
renderWorkers();
renderApps();
</script>
</body>
</html>
