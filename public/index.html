<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>포천시 위탁형 계절근로자 신청</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#eef5fb;color:#111}
button,input,textarea,select{font:inherit} .app{max-width:1100px;margin:auto;background:#fff;min-height:100vh}
header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #ddd}
.logo{font-weight:800;color:#168b43;font-size:18px}
main{padding:28px 20px}.panel{max-width:760px;margin:auto}.title{text-align:center;font-size:28px;font-weight:800;margin:10px 0 28px}
.card{border:1px solid #ddd;border-radius:14px;padding:18px;margin-bottom:16px;background:#fff;box-shadow:0 2px 8px #0000000a}
.notice-card{background:#f0f9f3;border:1px solid #c8e6c9;border-left:5px solid #168b43}
.notice-title{font-size:16px;font-weight:700;color:#168b43;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.notice-content{font-size:14px;color:#333;line-height:1.6;white-space:pre-line}
label{display:block;font-weight:700;margin:0 0 8px}.field{margin-bottom:17px} input,textarea,select{width:100%;padding:13px;border:1px solid #d5d5d5;border-radius:8px;background:#fff} textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hint{font-size:13px;color:#777;margin-top:6px}.radio label{display:inline-flex;align-items:center;font-weight:400;margin-right:18px}.radio input{width:auto;margin-right:5px}
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid #ddd}.calendar div{min-height:52px;border-right:1px solid #ddd;border-bottom:1px solid #ddd;padding:7px;font-size:13px}.calendar .head{background:#f5f5f5;font-weight:700;text-align:center;min-height:auto}.calendar .head:first-child{color:#e11}
.day{cursor:pointer}.day.disabled{color:#bbb;background:#f7f7f7;cursor:not-allowed}.day.holiday{color:#e11;background:#fff5f5}.day.selected{background:#168b43;color:#fff!important}.count{font-size:11px;color:#2255aa;margin-top:5px}.selected .count{color:#fff}.disabled .count{color:#a9a9a9}
.worker-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.worker{border:1px solid #ddd;border-radius:9px;padding:12px;cursor:pointer;background:#fff;transition:0.2s}.worker.selected{border:2px solid #168b43;background:#effbf3}.worker.locked{background:#f1f1f1;color:#aaa;cursor:not-allowed;border-color:#eee}.worker small{display:block;color:#666;margin-top:4px;font-size:12px}.worker.locked small{color:#aaa}
.actions{display:flex;gap:10px}.primary,.secondary{border:0;border-radius:8px;padding:14px 18px;cursor:pointer;font-weight:700}.primary{background:#00a83b;color:#fff;flex:1}.secondary{background:#eee;color:#333}
.status{padding:12px;border-radius:8px;background:#f3f8ff;margin:12px 0}
.mini{padding:6px 12px;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;line-height:1.2;margin:2px 0;}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;z-index:9999}
.invoice-box{background:#fff;padding:30px;border-radius:12px;width:90%;max-width:800px;box-shadow:0 4px 20px rgba(0,0,0,0.2);max-height:90vh;overflow-y:auto}
.alert-box{background:#fff;padding:32px 28px;border-radius:16px;width:90%;max-width:420px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.25)}
.alert-icon{font-size:48px;margin-bottom:12px;display:block}
.alert-title{font-size:20px;font-weight:800;color:#111;margin-bottom:8px}
.alert-body{font-size:14px;color:#555;line-height:1.5;margin-bottom:24px}
.callname-tag{display:inline-block;background:#e8f5e9;color:#08752f;font-weight:800;padding:2px 6px;border-radius:4px;border:1px solid #a5d6a7;font-size:13px;margin-right:4px;}
@media(max-width:650px){header{padding:0 14px}.logo{font-size:15px}main{padding:20px 12px}.title{font-size:23px}.row{grid-template-columns:1fr}.worker-grid{grid-template-columns:1fr}.calendar div{min-height:48px;padding:5px;font-size:12px}.card{padding:15px}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">포천시 농업재단 영농인력지원팀</div><div id="clock"></div></header>

<main><div class="panel">
<div class="title">포천시 위탁형 계절근로자 신청</div>

<div class="card notice-card">
<div class="notice-title" id="displayNoticeTitle">📢공지사항</div>
<div class="notice-content" id="displayNoticeBody">공지사항을 불러오는 중입니다...</div>
</div>

<div class="card">
<div class="cal-header">
<button class="mini" onclick="changeMonth(-1)">◀ 이전달</button>
<span id="calTitle"></span>
<button class="mini" onclick="changeMonth(1)">다음달 ▶</button>
</div>
<div id="calendar" class="calendar"></div>
<div class="hint">※ 신청가능인원 / 총인원 (일요일 및 공휴일은 휴무일입니다.)</div>
</div>

<div class="card">
<div class="row">
<div class="field"><label>농장주명</label><input id="farmerName" placeholder="농장주명을 입력하세요"></div>
<div class="field"><label>전화번호</label><input id="phone" placeholder="010-0000-0000"></div>
</div>
<div class="field"><label>농지 주소</label><input id="address" placeholder="도로명 주소 또는 지번 주소를 입력하세요"></div>
<div class="field"><label>작업 내용</label><textarea id="work" placeholder="예: 사과 적과 및 수확, 포장 작업"></textarea></div>
<div class="field radio"><label>선호 성별</label>
<label><input type="radio" name="gender" value="남성"> 남성</label>
<label><input type="radio" name="gender" value="여성"> 여성</label>
<label><input type="radio" name="gender" value="무관" checked> 무관</label></div>

<div class="field"><label>선호 근로자 <span class="hint">(이미 배정된 근로자는 선택할 수 없습니다.)</span></label>
<div id="workers" class="worker-grid"></div></div>

<div class="field"><label>신청 인원</label><div class="actions"><button class="secondary" onclick="changeQty(-1)">−</button><input id="qty" value="1" readonly style="text-align:center"><button class="secondary" onclick="changeQty(1)">+</button></div></div>
<div class="field"><label>기타 요청사항</label><textarea id="etc" placeholder="기타 요청사항을 작성해주세요"></textarea></div>
<div class="status"><b>예상 신청금액 (1일 기본일당 기준)</b> <span style="float:right;font-size:20px" id="price">₩120,000</span></div>
<div class="actions"><button class="primary" onclick="submitApplication()">신청하기</button><button class="secondary" onclick="lookup()">신청조회 및 취소</button></div>
</div>
</div></main>
</div>

<div id="invoiceModal" class="modal">
<div class="invoice-box">
<div id="invoiceContent"></div>
<div class="actions" style="margin-top:20px"><button class="secondary" onclick="closeInvoice()">닫기</button></div>
</div>
</div>

<div id="alertModal" class="modal">
<div class="alert-box">
<span class="alert-icon" id="alertIcon">✅</span>
<div class="alert-title" id="alertTitle">처리 완료</div>
<div class="alert-body" id="alertBody">요청하신 작업이 성공적으로 처리되었습니다.</div>
<button class="primary" style="width:100%" onclick="closeAlertAndReset()">확인</button>
</div>
</div>

<script>
const API_BASE_URL = '/api'; 
const KEY = 'seasonWorkerPrototype_v1';
const WORKER_KEY = 'seasonWorkers_master_v1';
const NOTICE_KEY = 'seasonNotice_v1';
const BASE_DAILY_PRICE = 120000;
const DEADLINE_HOUR = 17;

const HOLIDAYS = {
"2026-01-01": "신정", "2026-02-16": "설날 연휴", "2026-02-17": "설날", "2026-02-18": "설날 연휴",
"2026-03-01": "삼일절", "2026-03-02": "대체공휴일", "2026-05-05": "어린이날", "2026-05-24": "부처님오신날", "2026-05-25": "대체공휴일",
"2026-06-06": "현충일", "2026-08-15": "광복절", "2026-08-17": "대체공휴일", "2026-09-24": "추석 연휴", "2026-09-25": "추석",
"2026-09-26": "추석 연휴", "2026-10-03": "개천절", "2026-10-05": "대체공휴일", "2026-10-09": "한글날", "2026-12-25": "성탄절"
};

const defaultNotice = { title: '📢 공지사항', body: '• 일요일 및 공휴일은 근로자 휴무일로 신청이 불가능합니다.\n• 기본 하루 일당은 120,000원입니다.\n• 1일 기본 근로시간은 10시간입니다.\n• 당일 및 이전 날짜는 예약할 수 없으며, 오후 5시 이후에는 다음 날 예약이 제한됩니다.' };
const defaultWorkers = [
{ id: 'W001', name: 'INTHAVONG PHAIVANH', callName: '파이반', gender: '여성' },
{ id: 'W002', name: 'SIVILAY EMMY', callName: '에미', gender: '여성' },
{ id: 'W003', name: 'XAYYASENG KHAMPHOU', callName: '캄푸', gender: '남성' },
{ id: 'W004', name: 'PANETHONGDY NOUNE', callName: '눈', gender: '남성' },
{ id: 'W005', name: 'HER YENG', callName: '영', gender: '남성' }
];

function getWorkerList() { return JSON.parse(localStorage.getItem(WORKER_KEY) || JSON.stringify(defaultWorkers)); }
function loadNotice() {
const data = JSON.parse(localStorage.getItem(NOTICE_KEY) || JSON.stringify(defaultNotice));
document.getElementById('displayNoticeTitle').textContent = data.title;
document.getElementById('displayNoticeBody').textContent = data.body;
}

let workers = getWorkerList();
let currentDate = new Date();
let currentYear = currentDate.getFullYear();
let currentMonth = currentDate.getMonth() + 1;

function getMinSelectableDate() {
let now = new Date();
if (now.getHours() >= DEADLINE_HOUR) {
now.setDate(now.getDate() + 2);
} else {
now.setDate(now.getDate() + 1);
}
let y = now.getFullYear();
let m = String(now.getMonth() + 1).padStart(2, '0');
let d = String(now.getDate()).padStart(2, '0');
return `${y}-${m}-${d}`;
}

let minSelectableDateStr = getMinSelectableDate();
let selectedDate = minSelectableDateStr;

let qty = 1, selectedWorkers = [];
let pendingResetCallback = null;

function showAlert(icon, title, body, callback = null) {
document.getElementById('alertIcon').textContent = icon;
document.getElementById('alertTitle').textContent = title;
document.getElementById('alertBody').innerHTML = body;
document.getElementById('alertModal').style.display = 'flex';
pendingResetCallback = callback;
}
function closeAlertAndReset() { document.getElementById('alertModal').style.display = 'none'; if (pendingResetCallback) { pendingResetCallback(); pendingResetCallback = null; } }

async function apiFetch(endpoint, method = 'GET', body = null) {
  try {
    const options = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) options.body = JSON.stringify(body);
    const res = await fetch(`${API_BASE_URL}${endpoint}`, options);
    if (!res.ok) throw new Error();
    return await res.json();
  } catch (e) {
    let d = JSON.parse(localStorage.getItem(KEY) || '{"apps":[]}');
    if (endpoint === '/apps' && method === 'GET') return d.apps || [];
    if (endpoint === '/apps' && method === 'POST') { d.apps.push(body); localStorage.setItem(KEY, JSON.stringify(d)); return { success: true }; }
    if (endpoint.startsWith('/apps/') && method === 'PUT') {
      const idx = parseInt(endpoint.split('/')[2]);
      if (d.apps[idx]) { Object.assign(d.apps[idx], body); localStorage.setItem(KEY, JSON.stringify(d)); }
      return { success: true };
    try {
        const options = { method, headers: { 'Content-Type': 'application/json' } };
        if (body) options.body = JSON.stringify(body);
        const res = await fetch(`${API_BASE_URL}${endpoint}`, options);
        if (!res.ok) throw new Error(`서버 에러 (${res.status})`);
        return await res.json();
    } catch (e) {
        console.error('API 통신 에러:', e);
        throw e;
}
  }
}

// 해당 날짜의 실제 '남은 신청가능 인원 수'를 계산해주는 함수
