<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포천시 계절근로자 인력지원 신청 시스템</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
        body { background-color: #f4f6f9; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { font-size: 1.5rem; text-align: center; color: #1e3a8a; margin-bottom: 20px; }
        .notice-box { background: #eff6ff; border-left: 4px solid #2563eb; padding: 12px 15px; margin-bottom: 20px; border-radius: 4px; font-size: 0.9rem; color: #1e40af; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.95rem; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        button { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 1.05rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1d4ed8; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: #fff; padding: 20px; border-radius: 8px; max-width: 400px; width: 90%; text-align: center; }
        .modal-btn { margin-top: 15px; background: #2563eb; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>포천시 계절근로자 인력신청</h1>
        
        <div class="notice-box" id="noticeText">공지사항을 불러오는 중입니다...</div>

        <form id="appForm">
            <div class="form-group">
                <label>농가명 (신청자명)</label>
                <input type="text" id="farmName" required placeholder="예: 홍길동">
            </div>
            <div class="form-group">
                <label>연락처</label>
                <input type="tel" id="phone" required placeholder="예: 010-1234-5678">
            </div>
            <div class="form-group">
                <label>작업 희망일</label>
                <select id="workDate" required>
                    <option value="">일정을 선택하세요</option>
                </select>
            </div>
            <div class="form-group">
                <label>신청 인원수 (명)</label>
                <input type="number" id="workerCount" min="1" value="1" required>
            </div>
            <div class="form-group">
                <label>비고 / 요청사항</label>
                <textarea id="notes" rows="3" placeholder="필요한 작업 내용이나 요청사항을 적어주세요."></textarea>
            </div>
            <button type="submit">신청서 제출하기</button>
        </form>
    </div>

    <div class="modal" id="alertModal">
        <div class="modal-content">
            <p id="modalMsg"></p>
            <button class="modal-btn" onclick="closeModal()">확인</button>
        </div>
    </div>

    <script>
        const API_BASE_URL = '/api';

        function showAlert(msg) {
            document.getElementById('modalMsg').innerText = msg;
            document.getElementById('alertModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('alertModal').style.display = 'none';
        }

        async function apiFetch(endpoint, method = 'GET', body = null) {
            try {
                const options = { method, headers: { 'Content-Type': 'application/json' } };
                if (body) options.body = JSON.stringify(body);
                const res = await fetch(`${API_BASE_URL}${endpoint}`, options);
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.error || `서버 에러 (${res.status})`);
                }
                return await res.json();
            } catch (e) {
                console.error('API 통신 에러:', e);
                throw e;
            }
        }

        async function loadNotice() {
            try {
                const data = await apiFetch('/notice');
                document.getElementById('noticeText').innerText = data.content || '등록된 공지사항이 없습니다.';
            } catch (e) {
                document.getElementById('noticeText').innerText = '공지사항을 불러올 수 없습니다.';
            }
        }

        async function loadSchedules() {
            try {
                const schedules = await apiFetch('/schedules');
                const select = document.getElementById('workDate');
                select.innerHTML = '<option value="">일정을 선택하세요</option>';
                
                schedules.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item.date;
                    if (item.is_closed) {
                        opt.disabled = true;
                        opt.textContent = `${item.date} (마감되었습니다)`;
                    } else {
                        opt.textContent = `${item.date} (신청 가능: ${item.remaining_workers}명)`;
                    }
                    select.appendChild(opt);
                });
            } catch (e) {
                showAlert('일정 목록을 불러오지 못했습니다.');
            }
        }

        document.getElementById('appForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const farm_name = document.getElementById('farmName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const work_date = document.getElementById('workDate').value;
            const worker_count = parseInt(document.getElementById('workerCount').value, 10);
            const notes = document.getElementById('notes').value.trim();

            if (!work_date) {
                showAlert('작업 희망일을 선택해주세요.');
                return;
            }

            try {
                await apiFetch('/applications', 'POST', { farm_name, phone, work_date, worker_count, notes });
                showAlert('신청이 성공적으로 접수되었습니다!');
                document.getElementById('appForm').reset();
                loadSchedules();
            } catch (e) {
                showAlert(e.message || '신청 접수 중 오류가 발생했습니다.');
            }
        });

        loadNotice();
        loadSchedules();
    </script>
</body>
</html>
